name: Kurları çek

on:
  schedule:
    - cron: '47 3 * * *'   # her gün 06:47 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

# Vakit işiyle aynı grup: ikisi aynı anda push etmesin (vakit işi push'tan önce pull yapmıyor).
concurrency: cek

jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doğrula
        run: python3 -I betik/kur_test.py
      - name: Çek
        run: python3 -I betik/kur.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kur
          git diff --cached --quiet && exit 0
          git commit -m "Kurlar $(date -u +%F)"
          git pull --rebase
          git push
