name: Camileri çek

on:
  schedule:
    - cron: '23 2 3 * *'   # her ayın 3'ü 05:23 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

# Vakit, kur ve hutbe işleriyle aynı grup: aynı anda push etmesinler.
concurrency: cek

jobs:
  camiler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doğrula
        run: python3 -I betik/camiler_test.py
      - name: osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Çıkarımları indir ve ayıkla
        # Bölge başına: indir → cami/mescit kayıtlarını süz → GeoJSON'a çevir → büyük dosyayı sil (disk dolmasın).
        # Yeni bölge: buraya bir satır + betik/camiler.py → BOLGELER.
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/cami.geojsonseq"
          for bolge in europe/turkey asia/indonesia; do
            ad=$(basename "$bolge")
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ad.osm.pbf" "https://download.geofabrik.de/$bolge-latest.osm.pbf"
            osmium tags-filter "$RUNNER_TEMP/$ad.osm.pbf" nwr/religion=muslim nwr/building=mosque -o "$RUNNER_TEMP/$ad-cami.osm.pbf"
            rm "$RUNNER_TEMP/$ad.osm.pbf"
            osmium export "$RUNNER_TEMP/$ad-cami.osm.pbf" -f geojsonseq --add-unique-id=type_id -o "$RUNNER_TEMP/$ad.geojsonseq"
            cat "$RUNNER_TEMP/$ad.geojsonseq" >> "$RUNNER_TEMP/cami.geojsonseq"
            rm "$RUNNER_TEMP/$ad-cami.osm.pbf" "$RUNNER_TEMP/$ad.geojsonseq"
          done
          python3 -I betik/camiler.py "$RUNNER_TEMP/cami.geojsonseq" camiler
          du -sh camiler
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camiler
          git diff --cached --quiet && exit 0
          git commit -m "Camiler $(date -u +%F)"
          git pull --rebase
          git push
